{% extends "base.html" %}
{% block title %}Login — SecureBank{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">

      <div class="card shadow-sm border-0">
        <div class="card-body p-4">

          <!-- Card heading -->
          <div class="text-center mb-4">
            <div class="display-5 mb-2">🏦</div>
            <h1 class="h4 fw-bold text-primary">SecureBank</h1>
            <p class="text-muted small mb-0">Please sign in to your account</p>
          </div>

          <!-- Login form -->
          <form method="POST" action="{{ url_for('auth.login') }}" novalidate>

            <div class="mb-3">
              <label for="username" class="form-label fw-medium">Username</label>
              <input
                type="text"
                id="username"
                name="username"
                class="form-control"
                placeholder="Enter your username"
                autocomplete="username"
                required
              />
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-medium">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">
                Sign In
              </button>
            </div>

          </form>

        </div>
      </div>

      <!-- Demo hint -->
      <div class="card mt-3 border-0 bg-white shadow-sm">
        <div class="card-body p-3">
          <p class="text-muted small mb-1 fw-medium">Demo credentials</p>
          <ul class="list-unstyled text-muted small mb-0">
            <li><code>alice</code> / <code>password123</code></li>
            <li><code>bob</code> / <code>securepass</code></li>
          </ul>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
