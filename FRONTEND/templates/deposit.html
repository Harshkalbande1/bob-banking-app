{% extends "base.html" %}
{% block title %}Deposit Funds — SecureBank{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

          <h2 class="h4 fw-bold text-success mb-1">&#8593; Deposit Funds</h2>
          <p class="text-muted small mb-4">
            Enter the amount you wish to deposit into your account.
          </p>

          <form method="POST" action="{{ url_for('transactions.deposit_funds') }}" novalidate>

            <div class="mb-4">
              <label for="amount" class="form-label fw-medium">Amount ($)</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text">$</span>
                <input
                  type="number"
                  id="amount"
                  name="amount"
                  class="form-control"
                  placeholder="0.00"
                  min="0.01"
                  step="0.01"
                  required
                />
              </div>
              <div class="form-text">
                Maximum single deposit: $1,000,000.00
              </div>
            </div>

            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-success btn-lg">
                Confirm Deposit
              </button>
            </div>

          </form>

          <div class="text-center">
            <a href="{{ url_for('dashboard.dashboard') }}" class="text-muted small">
              &larr; Back to Dashboard
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
